name: Test and deploy CrossLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crosslab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test research workflow
        run: node tests/run.mjs

      - name: Test Cloudflare Worker runtime
        run: node --test tests/sciencepal-worker.test.mjs tests/worker-access.test.mjs

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build production site
        run: pnpm build

      - name: Configure Cloudflare access and deployment URLs
        env:
          CROSSLAB_WORKERS_DEV: ${{ vars.CROSSLAB_WORKERS_DEV }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          config.workers_dev = process.env.CROSSLAB_WORKERS_DEV === 'true';
          config.preview_urls = false;
          config.vars = { ...config.vars, CROSSLAB_AUTH_REQUIRED: 'true' };
          config.assets = { ...config.assets, binding: 'ASSETS', run_worker_first: true };
          config.ratelimits = (config.ratelimits || []).filter(binding => binding.name !== 'CROSSLAB_LOGIN_LIMITER');
          if (!config.ratelimits.length) delete config.ratelimits;
          config.durable_objects = { ...config.durable_objects, bindings: [
            ...(config.durable_objects?.bindings || []).filter(binding => binding.name !== 'CROSSLAB_LOGIN_GUARD'),
            { name: 'CROSSLAB_LOGIN_GUARD', class_name: 'LoginAttemptCounter' }
          ] };
          config.migrations = [...(config.migrations || []).filter(migration => migration.tag !== 'crosslab-login-v1'),
            { tag: 'crosslab-login-v1', new_sqlite_classes: ['LoginAttemptCounter'] }];
          writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log(`Deployment URLs: workers.dev=${config.workers_dev}; previews=false`);
          NODE

      - name: Check deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key. See docs/github-deployment.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --name crosslab-sciencepal --keep-vars

      - name: Record successful deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CROSSLAB_WORKERS_DEV: ${{ vars.CROSSLAB_WORKERS_DEV }}
        run: |
          {
            echo '### CrossLab deployed to Cloudflare Workers'
            echo "Commit: $GITHUB_SHA"
            echo 'Worker: crosslab-sciencepal'
            if [ "$CROSSLAB_WORKERS_DEV" = 'true' ]; then
              echo 'Production workers.dev URL enabled; preview URLs disabled.'
              echo 'Website access-code login is required for pages, APIs and static assets. The deployment log contains the URL and version.'
            else
              echo 'Bootstrap deployment: production and preview URLs disabled. Set the CROSSLAB_ACCESS_CODE Worker secret before enabling the production URL.'
              echo 'The deployment log above contains the deployment version.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
